name: Deploy to S3 + CloudFront

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets with long cache
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync ./out s3://$S3_BUCKET \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "_next/*" \
            --include "assets/*" \
            --include "**/*.css" \
            --include "**/*.js" \
            --include "**/*.png" \
            --include "**/*.jpg" \
            --include "**/*.jpeg" \
            --include "**/*.svg" \
            --include "**/*.webp" \
            --include "**/*.woff" \
            --include "**/*.woff2"

      - name: Sync HTML with short cache
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Root HTML (e.g., index.html, 404.html)
          aws s3 sync ./out s3://$S3_BUCKET \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"
          # Nested HTML (e.g., /about/index.html)
          aws s3 sync ./out s3://$S3_BUCKET \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "**/*.html"

      - name: Invalidate CloudFront
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION_ID --paths "/*" 